name: Attach release zip

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check manifest version matches the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION=$(python -c "import json; print(json.load(open('custom_components/dachs/manifest.json'))['version'])")
          if [ "$TAG" != "$MANIFEST_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME but manifest.json version is $MANIFEST_VERSION"
            exit 1
          fi

      - name: Build integration zip
        run: |
          cd custom_components
          zip -r "../dachs-${GITHUB_REF_NAME}.zip" dachs \
            -x "*__pycache__*" "*.pyc"

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dachs-${{ github.ref_name }}.zip
